# The Developers' Bakery: https://thebakery.dev
#
# The site uses its own layouts (_layouts/) and one stylesheet (assets/css/main.scss); there is no theme.
# This file is *NOT* reloaded automatically by `jekyll serve`: restart the server after changing it.

# Site Settings
locale: "en-GB"
title: "The Developers' Bakery"
title_separator: "-"
name: "The Developers' Bakery"
description: "A podcast about Developer Tools and productivity, freshly baked to you by Nicola Corti."
url: "https://thebakery.dev"
repository: "cortinico/thebakery"

# Show links, used by the layouts (listen buttons, footer)
links:
  spotify: "https://open.spotify.com/show/4jV6Yoz7D38sZJlYMzJm3k"
  apple: "https://podcasts.apple.com/us/podcast/the-developers-bakery/id1542849034"
  pocketcasts: "https://pca.st/vq8ml6pl"
  rss: "/podcast"
  x: "https://x.com/thebakerydev"
  email: "info@thebakery.dev"
  coffee: "https://buymeacoffee.com/cortinico"
  formspree: "https://formspree.io/mknpwond"

# SEO Related (read by _includes/seo.html)
google_site_verification:
bing_site_verification:
yandex_site_verification:
naver_site_verification:

# Social Sharing
twitter:
  username: "thebakerydev"
og_image: # Open Graph/Twitter default site image
social:
  type: "Organization"
  name:
  links:
    - "https://x.com/thebakerydev"
    - "https://x.com/cortinico"

# Site Author (read by _includes/seo.html and jekyll-feed)
author:
  name: "The Developers' Bakery"
  avatar: "/assets/images/avatar.png"
  bio: "A Podcast about Developer tools and libraries"
  email: "info@thebakery.dev"
  twitter: "thebakerydev"

# Reading Files
include:
  - .htaccess
  - _pages
exclude:
  - .idea
  - "*.sublime-project"
  - "*.sublime-workspace"
  - vendor
  - .asset-cache
  - .bundle
  - .jekyll-assets-cache
  - .sass-cache
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - node_modules
  - Rakefile
  - README.md
  - CLAUDE.md
  - renovate.json
  - tmp
  - /scripts
keep_files:
  - .git
  - .svn
encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"

# Conversion
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false

# Markdown Processing
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: "highlight"
    span:
      line_numbers: false
    block:
      line_numbers: false
      start_line: 1

# Sass/SCSS
sass:
  sass_dir: _sass
  style: compressed

# Outputting
permalink: /ep/:title
timezone: "Europe/London"

# Plugins. The site is built by GitHub Actions with `bundle exec jekyll build`, so these must be in the Gemfile.
plugins:
  - jekyll-redirect-from
  - jekyll-sitemap
  - jekyll-feed
  - jemoji

# Local server config
port: 4001
host: 127.0.0.1

# Defaults
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: episode

# Podcast Configuration (read by _pages/podcast.xml, the feed Apple Podcasts and Spotify use)
podcast_url: "https://thebakery.dev/"
podcast_copyright: "Copyright 2020 Nicola Corti"
podcast_album_art: "/assets/images/show-logo.png"
podcast_title: "The Developers' Bakery"
podcast_owner: "Nicola Corti"
podcast_email: "info@thebakery.dev"
podcast_category_one: "Technology"
podcast_category_two: "Education"
podcast_subcategory_one: "How To"
podcast_explicit: "false"
podcast_author: "Nicola Corti"
podcast_description: "A developer podcast about tools, libraries, and productivity. The Developers' Bakery is a place for open-source developers and maintainers to share their experience and projects. A journey through the tools and libraries that help developers worldwide baking great software daily. Join Nicola Corti through this journey among open source and beyond."
podcast_summary: "A developer podcast about tools, libraries, and productivity. The Developers' Bakery is a place for open-source developers and maintainers to share their experience and projects. A journey through the tools and libraries that help developers worldwide baking great software daily. Join Nicola Corti through this journey among open source and beyond."
podcast_subtitle: "A developer podcast about tools, libraries, and productivity. Featuring open-source developers and maintainers sharing their own experiences."
