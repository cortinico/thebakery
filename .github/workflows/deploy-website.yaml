name: Deploy Website

on:
  push:
    branches:
      - main
  schedule:
    # Jekyll excludes future-dated posts, so rebuild regularly to publish them
    # once their scheduled date has arrived, even without a new commit.
    - cron: '0 * * * *'

jobs:
  jekyll:
    runs-on: ubuntu-latest
    env:
      JEKYLL_ENV: production
    steps:
    - name: Checkout Repo
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Install Ruby Dependencies
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '4.0'
        bundler-cache: true

    - name: Build the Jekyll Website
      run: bundle exec jekyll build

    - name: Deploy Github Pages
      uses: JamesIves/github-pages-deploy-action@v4.9.0
      with:
        branch: gh-pages
        folder: _site/
        # Keep the pull request previews that preview-website.yaml deploys next to the site.
        clean-exclude: pr-preview/
